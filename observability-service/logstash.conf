input {
  # Read logs from all containers via TCP
  tcp {
    port => 5044
    codec => json_lines
  }
  # Also read from stdin for debugging
  stdin {
    codec => json_lines
  }
}

filter {
  # Parse Spring Boot log pattern: level [service,traceId,spanId]
  if [message] {
    grok {
      match => {
        "message" => "%{LOGLEVEL:log_level}\s+\[%{DATA:service_name},%{DATA:trace_id},%{DATA:span_id}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure"]
    }
  }

  # Parse timestamp
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Add severity numeric for sorting
  if [log_level] == "ERROR"  { mutate { add_field => { "severity" => 4 } } }
  if [log_level] == "WARN"   { mutate { add_field => { "severity" => 3 } } }
  if [log_level] == "INFO"   { mutate { add_field => { "severity" => 2 } } }
  if [log_level] == "DEBUG"  { mutate { add_field => { "severity" => 1 } } }

  # Tag simulation events for intelligence layer correlation
  if [log_message] =~ /SIMULATION/ {
    mutate { add_tag => ["simulation", "anomaly-trigger"] }
  }
  if [log_message] =~ /ANOMALY DETECTED/ {
    mutate { add_tag => ["anomaly"] }
  }
  if [log_message] =~ /RCA complete/ {
    mutate { add_tag => ["rca-result"] }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "platform-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  # Also output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
