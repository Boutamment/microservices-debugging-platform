spring.application.name=intelligence-service
server.port=4043
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http

spring.datasource.url=jdbc:postgresql://localhost:5432/intelligence_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Mb1mpsimp1@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=intelligence-group
spring.kafka.consumer.auto-offset-reset=earliest

llm.api-key=${GROQ_API_KEY:}
llm.chat-completions-url=${GROQ_CHAT_COMPLETIONS_URL:https://api.groq.com/openai/v1/chat/completions}
llm.model=${GROQ_MODEL:llama-3.3-70b-versatile}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
