spring.application.name=api-gateway
server.port=9098
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.access=unrestricted
management.tracing.sampling.probability=1.0
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.tracing.export.otlp.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
jwt.secret=dev-secret-key-change-this-to-a-long-random-value-123456789